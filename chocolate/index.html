---
layout: no-section
title: Kan Yilmaz - Dark Chocolate Tier List
---

<link rel="stylesheet" href="/stylesheets/tier-list.css">
<link rel="stylesheet" href="/chocolate/chocolate.css">

<main class="tier-page chocolate-page" aria-labelledby="chocolate-title">
  <header class="tier-page-header">
    <div>
      <p class="tier-page-kicker">The tasting ranking</p>
      <h1 id="chocolate-title" class="tier-page-title">Dark Chocolate Tier List</h1>
    </div>

    <div class="tier-filters chocolate-filters" aria-label="Filter chocolates">
      <label class="tier-filter chocolate-filter" for="country-filter">
        <span>Country</span>
        <select id="country-filter" class="tier-filter-control tier-filter-control--choice">
          <option value="">All countries</option>
        </select>
      </label>

      <label class="tier-filter chocolate-filter" for="brand-filter">
        <span>Brand</span>
        <select id="brand-filter" class="tier-filter-control tier-filter-control--choice">
          <option value="">All brands</option>
        </select>
      </label>
    </div>
  </header>

  <p id="chocolate-status" class="chocolate-status" role="status" aria-live="polite">Loading chocolates…</p>
  <div id="chocolate-board" class="tier-board" aria-busy="true"></div>
</main>

<div id="chocolate-tooltip" class="tier-tooltip" role="tooltip" hidden></div>

<script src="/javascripts/tier-list.js"></script>
<script src="/chocolate/chocolate.js"></script>
